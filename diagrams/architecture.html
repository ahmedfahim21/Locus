    :root { color-scheme: light; background: #f5f5f7; }
    body { margin: 0; padding: 20px; }
    main { max-width: 1440px; margin: auto; overflow: auto; border-radius: 12px; }
    main:focus-visible { outline: 2px solid #171b21; outline-offset: 3px; }
    svg.board { display: block; width: 100%; min-width: 1120px; height: auto; background: #fffefa; }
    text { fill: #232126; font: 400 17px Excalifont, "Chalkboard SE", cursive; }
    .title { font-size: 54px; letter-spacing: -2px; }
    .subtitle { font-size: 23px; fill: #504949; }
    .heading { font-size: 25px; letter-spacing: -.55px; }
    .api-title { font-size: 32px; }
    .detail { fill: #373139; }
    .label { font-size: 16px; text-anchor: middle; }
    .short-label { font-size: 14px; }
    .number { font-size: 18px; text-anchor: middle; }
    .paper { fill: #fffcf5; }
    .pink { fill: #fac9d9; }
    .blue { fill: #a9d6fc; }
    .lavender { fill: #ded0fa; }
    .yellow { fill: #ffe7a7; }
    .green { fill: #b5ecc0; }
    .mint { fill: #a6e7d8; }
    .orange { fill: #ffd2a0; }
    .ink {
      fill: none;
      stroke: #30272b;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .rough { filter: url(#roughen); }
    .second-stroke { opacity: .28; stroke-width: 1.05; }
    .map-label { fill: #f3d27a; font-size: 14px; }
    .map-streets { fill: none; stroke: #434e5a; stroke-width: 2; stroke-linecap: round; }
    .map-route { fill: none; stroke: #5ab0ff; stroke-width: 3.3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { marker-end: url(#tip); }
    .both { marker-start: url(#tip); }
    .icon { color: #282329; }
    @media (max-width: 700px) { body { padding: 8px; } }
    @media print {
      body { padding: 0; }
      main { overflow: visible; }
      svg.board { min-width: 0; print-color-adjust: exact; }
    }
  </style>

  <main aria-label="Locus architecture. Scroll horizontally on narrow screens." tabindex="0">
    <svg class="board" viewBox="0 0 1344 768" role="img" aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg">
      <title id="diagram-title">Locus architecture</title>
      <desc id="diagram-description">One: the rider dials a Locus number. Two: Vobiz carries calls over SIP to LiveKit and routes outbound calls and handoffs. Three: a LiveKit Agents worker transcribes the rider's audio through Sarvam by default, with OpenAI as an option. The worker and the guide API run on AWS EC2 in Mumbai. Four: the Hono guide API screens the call, matches landmarks using its OSM road graph in PostGIS, and calls a model for ambiguous clues. Five: the API returns directions or requests a handoff, and the worker speaks the directions into the call. Separately, the recipient signs in with Supabase Auth and sets their gate and landmarks in the web app. The API processes walk media with FFmpeg, OpenAI vision and Sarvam translation. Supabase Storage holds the video and photos.</desc>
